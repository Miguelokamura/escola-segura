{% extends "base.html" %}
{% block conteudo %}

<table id="tabela-registros">
  <tr><th>Aluno</th><th>Turma</th><th>Tipo</th><th>Método</th>

{% endblock %}
{% block scripts %}
<script src="/static/js/app.js"></script>
<script>
carregar();
setInterval(carregar, 10000);
</script>
{% endblock %}
